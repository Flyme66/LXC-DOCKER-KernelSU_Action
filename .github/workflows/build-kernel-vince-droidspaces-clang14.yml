name: 编译 lxc-docker-vince-droidspaces 内核 clang 14
on:
  watch:
    types: [started]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 环境变量配置
      run: |
        cat config_vince_Droidspaces.env | grep KERNEL_SOURCE= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep KERNEL_CONFIG= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep ENABLE_KERNELSU= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep LLVM_CONFIG= >> $GITHUB_ENV
        cat config_vince_Droidspaces.env | grep KERNELSU_TAG= >> $GITHUB_ENV

    - name: 构建编译内核环境
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载Clang-aosp编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: 开启lxc和docker配置
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/Flyme66/lxc-docker/releases/download/Lxc5.0/add-lxc-docker-droidspaces-custom.sh
        chmod 755 add-lxc-docker-droidspaces-custom.sh
        ./add-lxc-docker-droidspaces-custom.sh android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/${{ env.KERNEL_CONFIG }}

    - name: 添加runc补丁
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/Flyme66/lxc-docker/releases/download/Lxc5.0/runcpatch.sh
        chmod a+x runcpatch.sh
        if [ -f android-kernel/kernel/cgroup.c ]; then
          ./runcpatch.sh android-kernel/kernel/cgroup.c
        fi

    - name: 完整克隆ReSukiSU（递归子模块）
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        rm -rf ReSukiSU
        git clone --recursive --depth=1 -b main https://github.com/ReSukiSU/ReSukiSU ReSukiSU
        ls -la ReSukiSU/kernel/

    - name: 手动部署KernelSU源码（Manual‑Hook）
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU drivers/kernelsu
        cp -r ../ReSukiSU/kernel/KernelSU ./KernelSU
        # 使用manual hook，不自动修改drivers
        echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ env.KERNEL_CONFIG }}
        # 调试打印文件列表确认
        ls -la ./KernelSU
        ls -la ./KernelSU/src

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
        export KBUILD_BUILD_HOST=17
        export KBUILD_BUILD_USER=HyperPower
        rm -rf out
        make -s O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}

        if [ "${{ env.LLVM_CONFIG }}" = "y" ]; then
          make -j$(nproc --all) CC="clang" O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-" LLVM=1 LLVM_IAS=1
        else
          make -j$(nproc --all) CC="clang" O=out ARCH=arm64 CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
        fi

    - name: 准备打包内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/Flyme66/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch

    - name: 打包并上传
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}
        path: kernel_workspace/AnyKernel3/*
